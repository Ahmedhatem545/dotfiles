# sample hyprlock.conf
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
#
# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace
#
# you can get started by copying this config to ~/.config/hypr/hyprlock.conf
#

$font = JetBrainsMono Nerd Font

# --- Melange Dark Colors ---
$text = rgb(ECE1D7)
$textAlpha33 = ECE1D733
$textAlpha55 = ECE1D755
$textAlpha99 = ECE1D799
$light1 = rgb(ECE1D7)
$red = rgb(BD8183)
$green = rgb(78997A)
$blue = rgb(7F91B2)
# ---------------------------

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = /home/ahmed-work/Pictures/wallhaven-yq2zwl_1920x1080.png
    blur_passes = 5
    blur_size = 5
}

# Profile Picture
image {
    monitor =
    path = /home/ahmed-work/Pictures/imgs/pfp.jpg
    size = 100
    rounding = -1 # Set to -1 to make the image circular (requires 1:1 aspect ratio image)
    border_size = 0 # Outline removed
    border_color = rgba($textAlpha33)
    position = 0, 200
    halign = center
    valign = bottom
}

#user
label {
    monitor =
    text = $USER
    font_family = $font
    color = $light1
    position = 0, 160
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 200, 30
    outline_thickness = 3
    inner_color = rgba($textAlpha33)

    outer_color = rgba($textAlpha33)
    check_color = $red
    fail_color = $red

    font_color = rgba($textAlpha99)
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text =
    fail_text =

    dots_size = 0.4
    dots_spacing = 0.3

    position = 0, 80
    halign = center
    valign = bottom
}

# TIME
label {
    monitor =
    text = cmd[update:1]  date +"%l:%M"
    font_size = 120
    font_family = $font black
    position = 0, -200
    halign = center
    valign = top
    color = rgba($textAlpha55)
}

# day
label {
    monitor =
    text = cmd[update:1] date +"%a"
    font_size = 16
    font_family = $font
    position = -150, -380
    halign = center
    valign = top
    color = $text
}

#separator (between day and date)
label {
    monitor =
    text = 
    font_size = 14
    font_family = $font
    position = -100, -382
    halign = center
    valign = top
    color = rgb(E49B5D)
}

# date
label {
    monitor =
    text = cmd[update:1] date +"%e"
    font_size = 16
    font_family = $font
    position = -50, -380
    halign = center
    valign = top
    color = $text
}

#separator (between date and month)
label {
    monitor =
    text = 
    font_size = 14
    font_family = $font
    position = 0, -382
    halign = center
    valign = top
    color = rgb(BD8183)
}

# month
label {
    monitor =
    text = cmd[update:1] date +"%b"
    font_size = 16
    font_family = $font
    position = 50, -380
    halign = center
    valign = top
    color = $text
}

#separator (between month and year)
label {
    monitor =
    text = 
    font_size = 14
    font_family = $font
    position = 100, -382
    halign = center
    valign = top
    color = rgb(78997A)
}

# Year
label {
    monitor =
    text = cmd[update:1] date +"%Y"
    font_size = 16
    font_family = $font
    position = 150, -380
    halign = center
    valign = top
    color = $text
}
